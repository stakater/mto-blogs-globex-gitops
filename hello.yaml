# The contents of https://github.com/stakater/mto-blogs-globex-gitops: a small
# web server that shows which tenant deployed it. It runs on OpenShift's
# default security settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-page
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head><meta charset="utf-8"><title>Hello from globex</title></head>
      <body style="font-family: sans-serif; text-align: center; margin-top: 20vh">
        <h1>Hello from tenant globex</h1>
        <p>Deployed by Argo CD from github.com/stakater/mto-blogs-globex-gitops</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels: { app: hello }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello }
  template:
    metadata:
      labels: { app: hello }
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /var/www/html
      volumes:
        - name: page
          configMap:
            name: hello-page
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector: { app: hello }
  ports:
    - port: 8080
      targetPort: 8080
---
# Opens the page in a browser, at https://hello-<namespace>.<apps domain>.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hello
spec:
  to: { kind: Service, name: hello }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
